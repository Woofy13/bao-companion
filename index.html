<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bao Companion</title>
<meta name="description" content="Bao Companion">
<style>
:root{--bg:#fbfaf7;--fg:#1f2430;--muted:#5d6475;--card:#fff;--line:#e4e1d8;--accent:#c2571a}
@media (prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e8eaf0;--muted:#9aa2b5;--card:#1e232e;--line:#2c3342;--accent:#f0a070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:2rem;margin:.4em 0 .2em;display:flex;align-items:center;gap:.5rem}
h2{font-size:1.15rem;margin:1.8em 0 .5em}
p{margin:.6em 0}
.lead{color:var(--muted);font-size:1.1rem}
ul{padding-left:1.2em}
li{margin:.3em 0}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 18px 12px}
footer{margin-top:2.5em;padding-top:1em;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Cat mark"><path d="M8 40V10l10 8h12l10-8v30z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" style="color:var(--accent)"/><circle cx="18" cy="27" r="2.2" fill="currentColor"/><circle cx="30" cy="27" r="2.2" fill="currentColor"/></svg>

<footer>
